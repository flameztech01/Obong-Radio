<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon / Logo -->
    <!-- Using type="image/jpeg" since it's a .jfif file -->
    <link rel="icon" type="image/jpeg" href="/logo.jfif" />
    <link rel="apple-touch-icon" href="/logo.jfif" />
    
    <!-- Theme Color (Matches your zinc-950 background) -->
    <meta name="theme-color" content="#09090b" />

    <!-- SEO & Page Title -->
    <title>Obong University Radio | Campus Portal</title>
    <meta name="description" content="The official campus radio portal for Obong University. Stream live shows, join the live chat, and stay connected with the campus community." />
    
    <!-- Open Graph (For sharing on WhatsApp/Twitter) -->
    <meta property="og:title" content="Obong University Radio" />
    <meta property="og:description" content="Stream live campus radio, join live chats, and discover new shows." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.jfif" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
